# DecisionJury 前端 Nginx 配置
# 关键点：前端调用的是相对路径 /api/* 和 /auth/*（见 frontend/src/api/index.ts、
# frontend/src/api/auth.ts），且后端 auth 路由没有 /api 前缀，
# 所以这里必须配两条 location，缺一条登录就会 404。

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 静态资源带 hash，可长期缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # 业务接口：/api/* → 后端（backend routers prefix="/api"）
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # 辩论链路要串行调用 LLM（解析/正反方/法官），耗时较长
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 认证接口：后端 auth router prefix="/auth"（注意没有 /api 前缀）
    location /auth/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA 路由回退：刷新 /cases/xxx 这类前端路由时回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
