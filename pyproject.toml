[project]
name = "decisionjury"
version = "0.1.0"
description = "DecisionJury MVP backend agent orchestration skeleton"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "sqlalchemy>=2.0.0",
    "python-dotenv>=1.0.0",
    "jieba>=0.42.1",
    "rank-bm25>=0.2.2",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt==3.2.0",
    "python-jose[cryptography]>=3.3.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "httpx2>=2.5.0",
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
# 与 CI 一致（.github/workflows/tests.yml 跑 `pytest tests`）。
# 不加这条时裸跑 `pytest` 会去收集 backend/test/ 下历史遗留的脚本（依赖真实数据库），
# 直接以 collection error 终止，掩盖真实用例结果。
testpaths = ["tests"]
